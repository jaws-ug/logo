name: Fetch Repository Permissions

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  fetch-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository permissions
        run: gh api repos/${{ github.repository }} --jq '.permissions // {}'
        env:
          GH_TOKEN: ${{ github.token }}
